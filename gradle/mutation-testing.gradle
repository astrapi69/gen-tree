dependencies {
    pitest libs.pitest.testng.plugin
}

pitest {
    testPlugin = "testng"
    pitestVersion = libs.versions.pitest.version.get()
    targetClasses = ["io.github.astrapi69.gen.tree.*"]
    threads = 4
    // The mutator set, named so a reader of the score knows it: DEFAULTS is what PIT
    // runs when nothing is said. STRONGER measured 546 of 579 (94 %) on 2026-10-17,
    // under the floor of 95 in build.gradle; switching needs the survivors triaged first.
    mutators = ["DEFAULTS"]
    // XML is what the mutation-context step in .github/workflows/gradle.yml reads.
    outputFormats = ["HTML", "XML"]
    timestampedReports = false
}
